[project]
name = "llm-text-games"
version = "0.1.0"
description = "Console text games powered by OpenAI-compatible LLMs"
requires-python = ">=3.12,<3.13"
dependencies = ["openai>=1.0", "pydantic-settings>=2.0", "rich>=13.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
